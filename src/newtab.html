<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Tab</title>
    <link rel="stylesheet" href="styles/general.css"/>
    <link rel="stylesheet" href="styles/modal.css"/>
    <link rel="stylesheet" href="styles/shortcuts.css"/>
    <link rel="stylesheet" href="styles/backgrounds.css"/>
    <link rel="icon" type="image/png" href="../icons/icon32.png"/>
    <script src="backgrounds.js" type="module"></script>
    <script src="shortcuts.js" type="module"></script>
</head>

<body>
<div id="background-layer"></div>

<div class="container"
>
    <div id="shortcuts-container"
    >
        <div id="add-shortcut-button"
             class="shortcut-card"
             title="Add new shortcut"
        >
            <div class="content-wrapper"
            >
                <svg width="48" height="48" viewBox="0 0 24 24"
                     fill="none" stroke="var(--text-color)" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                >
                    <line x1="12" y1="7" x2="12" y2="17"/>
                    <line x1="7" y1="12" x2="17" y2="12"/>
                </svg>
                <div class="shortcut-label"
                >
                    Add
                </div>
            </div>
        </div>
    </div>

    <div id="background-area"
    >
        <button id="toggle-backgrounds-btn"
        >
            Backgrounds
        </button>
        <div id="backgrounds-container"
        >
            <div id="add-background-button"
                 class="add-background-card"
                 title="Add new background"
            >
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
                     stroke="var(--text-color)" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                >
                    <line x1="12" y1="7" x2="12" y2="17"/>
                    <line x1="7" y1="12" x2="17" y2="12"/>
                </svg>
            </div>
        </div>
    </div>
</div>

<template id="shortcut-template"
>
    <a class="shortcut-card"
       href=""
    >
        <div class="shortcut-edit"
             title="Edit shortcut"
        >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"
            >
                <circle cx="12" cy="5" r="2"/>
                <circle cx="12" cy="12" r="2"/>
                <circle cx="12" cy="19" r="2"/>
            </svg>
        </div>
        <div class="content-wrapper"
        >
            <img class="shortcut-icon"
                 src=""
                 alt=""
            >
            <div class="shortcut-label"
            >
            </div>
        </div>
    </a>
</template>

<template id="background-template"
>
    <div class="background-card"
    >
        <img class="background-thumb"
             src=""
             alt=""
        >
        <div class="background-edit"
             title="Edit background"
        >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"
            >
                <circle cx="12" cy="5" r="2"/>
                <circle cx="12" cy="12" r="2"/>
                <circle cx="12" cy="19" r="2"/>
            </svg>
        </div>
    </div>
</template>

<template id="shortcut-modal"
>
    <div class="modal">
        <form class="modal-content">
            <h2 class="modal-title"></h2>

            <label class="modal-section">
                Name
                <input id="shortcut-name"
                       type="text"
                       name="name"
                       class="text-input"
                       placeholder="Awesome shortcut"
                       required
                >
            </label>

            <label class="modal-section">
                URL
                <input id="shortcut-url"
                       type="url"
                       name="url"
                       class="text-input"
                       placeholder="https://github.com/Nounours0261"
                       required
                >
            </label>

            <div class="modal-actions">
                <div class="stick-left">
                    <button id="delete-shortcut" class="modal-button red" type="button">Delete</button>
                </div>
                <div class="stick-right">
                    <button id="cancel-shortcut" class="modal-button blue" type="button">Cancel</button>
                    <button id="save-shortcut" class="modal-button green" type="submit">Save</button>
                </div>
            </div>
        </form>
    </div>
</template>

<template id="background-modal">
    <div class="modal">
        <form class="modal-content">
            <h2 class="modal-title"></h2>

            <label class="modal-section">
                URL
                <input id="background-url-input"
                       type="url"
                       name="url"
                       class="text-input"
                       placeholder="https://i.imgur.com/xJ92icr.png"
                       required
                >
            </label>
            <label class="modal-section">
                Upload image
                <input type="file" accept="image/*" id="background-image-input">
            </label>
            <div class="modal-section">
                Theme
                <div class="stick-left">
                    <label>
                        <input type="radio" name="theme" value="black" checked>
                        Black
                    </label>
                    <label>
                        <input type="radio" name="theme" value="white">
                        White
                    </label>
                </div>
            </div>
            <div class="modal-actions">
                <div class="stick-left">
                    <button id="delete-background" class="modal-button red" type="button">Delete</button>
                </div>
                <div class="stick-right">
                    <button id="cancel-background" class="modal-button blue" type="button">Cancel</button>
                    <button id="save-background" class="modal-button green" type="submit">Save</button>
                </div>
            </div>
        </form>
    </div>
</template>
</body>
</html>
